name: Bug report
description: Report a problem in the FastAPI app or the Vite page.
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        The API is under `backend/`. The page is under `frontend/`. Name the route or file you hit, and the value of `LOCALIZATION_PROVIDER` if you called the API.

  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: POST /v1/translate returns an unexpected body
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. From backend/, run uvicorn app.main:app --port 8000
        2. LOCALIZATION_PROVIDER=mock
        3. Send the request and paste the response
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LOCALIZATION_PROVIDER
      options:
        - mock
        - openai
        - anthropic
        - ollama
        - not applicable
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Python, Node, and OS
      placeholder: Python 3.12, Node 20
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Response body or command output
      render: shell
    validations:
      required: false
