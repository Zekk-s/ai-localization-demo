name: Feature request
description: Suggest a change to the files in this repository.
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Say which file or route the change would touch, and what the behavior should be.

  - type: input
    id: title
    attributes:
      label: Short title
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What should change?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Routes or environment variables
      placeholder: Which route, request field, or env var would change?
    validations:
      required: false
